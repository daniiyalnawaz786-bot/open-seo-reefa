# docker compose up -d, then open http://localhost:3000
services:
    openseo:
        build: .
        ports:
            - '127.0.0.1:3011:3000'
        environment:
            ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
            PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
            OPENSEO_ALLOW_PRIVATE: ${OPENSEO_ALLOW_PRIVATE:-}
            OPENSEO_RATE_LIMIT: ${OPENSEO_RATE_LIMIT:-60}
            OPENSEO_MAX_CONCURRENT: ${OPENSEO_MAX_CONCURRENT:-4}
            OPENSEO_USER_AGENT: ${OPENSEO_USER_AGENT:-}
            SMTP_URL: ${SMTP_URL:-}
            SMTP_FROM: ${SMTP_FROM:-}
            OPENSEO_SCHEDULER: ${OPENSEO_SCHEDULER:-}
        volumes:
            - openseo-data:/data
        # Lets OpenSEO reach sites running on your own computer (Linux needs this; Mac and Windows have it).
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        restart: unless-stopped

volumes:
    openseo-data:
